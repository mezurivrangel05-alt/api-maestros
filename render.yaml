databases:
  - name: api-maestros-db
    databaseName: maestros
    user: maestros
    plan: basic-256mb

services:
  - type: web
    name: api-maestros
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-maestros-db
          property: connectionString
      - key: NODE_ENV
        value: production
